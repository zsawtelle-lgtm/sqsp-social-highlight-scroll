<!-- ===================================================================
     IG Carousel — paste into:
     Settings → Advanced → Code Injection → FOOTER (sitewide)
     Global settings (window.IGCarouselConfig) must stay ABOVE the script.
     =================================================================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zsawtelle-lgtm/sqsp-social-highlight-scroll@1/src/ig-carousel.css">
<script>
  window.IGCarouselConfig = {
    /* ---- Single profile: the account shown on every post ----
       (Profile per post instead? Use data-avatar="first-image" on the
       code block — see docs/INSTALL.md "Profiles".) */
    account: 'your.account',          // account name
    avatar:  '',                      // profile image URL
    profile: 'https://www.instagram.com/your.account/'  // where the name links ('' = no link)

    /* Layout, aspect, theme, spacing and fonts are set per carousel in
       Design → Custom CSS — see snippets/custom-css-examples.css */
  };
</script>
<script defer src="https://cdn.jsdelivr.net/gh/zsawtelle-lgtm/sqsp-social-highlight-scroll@1/src/ig-carousel.js"></script>
