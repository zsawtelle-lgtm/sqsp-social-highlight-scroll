     =================================================================== -->

    /* ---- Defaults for every carousel on the site ---- */

    layout:  'focus'                  // focus (one centred post) | row (several side by side)

    /* ---- Per-carousel overrides, keyed by section anchor id ----
    , carousels: {
      'ig-carousel-2': { theme: 'dark', aspect: '1:1' },
      'ig-carousel-3': { layout: 'row', perView: 3 }
    }
    */
  };
